[geometry]
# The head lattice itself comes from head_envelope_mm (geometry/cap_lattice.py);
# the dome values below are the single-shell hemisphere equivalent of the same
# design point, so --geometry dome on this config gives the comparison shell.
aperture_radius = 0.0
dome_radius = 0.145
dome_height = 0.145
n_layers = 16
magnet_size = 0.012
remanence = 1.31
min_clearance = 0.0135

[seed]
reg = 1e-3
iterations = 40
mirror = none

[physics]
field_model = cuboid
chi_par = 0.05
chi_perp = 0.10

[fov]
# Half-spherical ROI: sphere of radius 0.075 cut at z >= 0.010. The training
# grid and the pinned evaluation set data/head_roi.npz describe the same
# region; only the sampling density differs.
size_x = 0.16
size_y = 0.16
size_z = 0.16
resolution_x = 0.008
resolution_y = 0.008
resolution_z = 0.008
radius = 0.075
z_min = 0.010
