# ROMA as published, ideal magnets, to compare on the terms its figure is quoted on.
#
# The arrangement comes in through --init-design and carries its own side
# lengths, 1,936 cubes of 12 mm and 384 bricks of 12 by 12 by 50. It is
# therefore evaluated with the cuboid model and a world body frame, which is
# the only pair that reproduces the published 408 ppm. The geometry block is
# unused but the parser wants it.
[geometry]
aperture_radius = 0.0
dome_radius = 0.213
dome_height = 0.187
n_layers = 18
magnet_size = 0.012
remanence = 1.31
min_clearance = 0.0135

[seed]
reg = 1e-3
iterations = 40
mirror = none

[physics]
field_model = mixed
chi_par = 0.0
chi_perp = 0.0

[fov]
# The full 200 mm diameter sphere the published figure is quoted over.
size_x = 0.21
size_y = 0.21
size_z = 0.21
resolution_x = 0.008
resolution_y = 0.008
resolution_z = 0.008
radius = 0.100
z_min = -0.100
